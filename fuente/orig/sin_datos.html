<!doctype html>
<html lang="es">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1d1c1a; --panel: rgba(38, 38, 36, .86); --line: rgba(255, 255, 255, .08);
    --text: #f2f0e8; --muted: #a29f95; --accent: #d97757; --accent-soft: rgba(217, 119, 87, .18);
    --track: rgba(255, 255, 255, .12); --shadow: 0 10px 40px rgba(0, 0, 0, .35);
  }
  :root[data-theme="light"] {
    --bg: #f0eee6; --panel: rgba(250, 249, 245, .9); --line: rgba(31, 30, 29, .08);
    --text: #1f1e1d; --muted: #75736c; --accent: #c96442; --accent-soft: rgba(201, 100, 66, .12);
    --track: rgba(31, 30, 29, .12); --shadow: 0 10px 34px rgba(60, 50, 30, .14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.35 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; outline: none; }
  #carga { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 9; transition: opacity .6s; }
  #carga div { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--track); border-top-color: var(--accent); animation: g .9s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  #panel { position: fixed; top: 16px; right: 16px; width: 256px; padding: 14px 14px 12px; border-radius: 16px;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); box-shadow: var(--shadow); z-index: 5; transition: opacity .25s, transform .25s; }
  #panel.oculto { opacity: 0; transform: translateX(12px) scale(.98); pointer-events: none; }
  .fila { display: flex; align-items: center; gap: 8px; }
  .entre { justify-content: space-between; }
  .btn { border: 1px solid var(--line); background: transparent; color: var(--text); height: 32px; min-width: 32px;
    border-radius: 10px; display: inline-grid; place-items: center; cursor: pointer; padding: 0 10px; font: inherit; }
  .btn:hover { background: var(--accent-soft); }
  .btn.prim { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; flex: 1; gap: 6px;
    display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; }
  .btn svg { width: 16px; height: 16px; }
  .ctl { margin-top: 12px; }
  .ctl label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .ctl label b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: var(--track); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--accent); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); cursor: pointer; }
  .seg { display: flex; gap: 4px; margin-top: 12px; padding: 3px; border-radius: 11px; background: var(--track); }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 8px; padding: 6px 4px; font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .18); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  .chip.on { background: var(--accent-soft); color: var(--text); border-color: transparent; }
  .q { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: none; }
  .q.ver { display: block; }
  .q .fila { color: var(--muted); font-size: 12px; }
  .q b { color: var(--text); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
  #hidro { width: 100%; height: 40px; display: block; margin-top: 6px; }
  #abrir { position: fixed; top: 16px; right: 16px; width: 40px; height: 40px; border-radius: 12px; z-index: 4;
    background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--accent);
    display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(14px); }
  #abrir svg { width: 18px; height: 18px; }
  .marca { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 3; font-size: 11px; font-weight: 500;
    color: var(--text); background: var(--panel); border: 1px solid var(--line); padding: 3px 8px; border-radius: 999px;
    transform: translate(-50%, -140%); white-space: nowrap; backdrop-filter: blur(8px); }
  .marca::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 1px; height: 8px; background: var(--muted); }
  .marca.acento { color: #fff; background: var(--accent); border-color: var(--accent); }
  .fuente { margin-top: 10px; font-size: 10px; line-height: 1.3; color: var(--muted); opacity: .75; }
  @media (max-width: 520px) { #panel { left: 16px; right: 16px; width: auto; top: auto; bottom: 16px; } #abrir { top: auto; bottom: 16px; } }
</style>

<body>
<div id="carga"><div></div></div>
<button id="abrir" title="Mostrar panel" aria-label="Mostrar panel">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10l5-4 5 4v10M14 20v-7l3-2 3 2v7M3 20h18"/></svg>
</button>
<div id="panel">
  <div class="fila">
    <button class="btn prim" id="bLluvia"></button>
    <button class="btn" id="bVista" title="Vista inicial" aria-label="Vista inicial">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></svg>
    </button>
    <button class="btn" id="bOcultar" title="Ocultar panel" aria-label="Ocultar panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>

  <div class="ctl"><label>Hora <b id="vHora"></b></label><input id="sHora" type="range" min="5" max="23.5" step="0.05" value="16"></div>
  <div class="ctl" id="ctlInt"><label>Lluvia <b id="vInt"></b></label><input id="sInt" type="range" min="5" max="120" step="1" value="60"></div>
  <div class="seg" id="vistas">
    <button data-v="general" class="on">General</button>

    <button class="chip on" data-k="arboles">Árboles</button>
    <button class="chip on" data-k="nombres">Nombres</button>

    <button class="chip" data-k="tema">Tema claro</button>
  </div>
  <div class="q" id="bloqueQ">
    <div class="fila entre"><span>Agua que llega al río</span><b id="vQ">0 %</b></div>
    <canvas id="hidro"></canvas>
  </div>
  <div class="fuente">© OpenStreetMap · Microsoft Building Footprints (ODbL) · Copernicus Sentinel-2 y GLO-30 · ESA WorldCover. Alturas estimadas.</div>
</div>
<div id="etiquetas"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const C = window.DATOS_CIUDAD;
const W = C.W, H = C.H, CEL = C.celda;
const MX = W * CEL / 2, MZ = H * CEL / 2;           // medio ancho / medio largo (m)
const $ = id => document.getElementById(id);
async function inflar(b64, Tipo) {
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const f = new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Tipo(await new Response(f).arrayBuffer());
}
const E = C.edificios;
const [z16, nV, pri, dlt, atr, arbData, posteData, flujo] = await Promise.all([
  inflar(C.z, Uint16Array), inflar(E.n, Uint16Array), inflar(E.pri, Int32Array), inflar(E.dlt, Int16Array),
  inflar(E.at, Uint8Array), inflar(C.arboles, Int16Array), inflar(C.postes, Int16Array), inflar(C.flujo, Uint8Array)]);
const elev = new Float32Array(W * H); for (let i = 0; i < W * H; i++) elev[i] = z16[i] / 20;
function altura(x, z) {
  let fi = (x + MX) / CEL - 0.5, fj = (z + MZ) / CEL - 0.5;
  fi = Math.min(W - 1.001, Math.max(0, fi)); fj = Math.min(H - 1.001, Math.max(0, fj));
  const i = fi | 0, j = fj | 0, a = fi - i, b = fj - j, k = j * W + i;
  return (elev[k] * (1 - a) + elev[k + 1] * a) * (1 - b) + (elev[k + W] * (1 - a) + elev[k + W + 1] * a) * b;
}

// ---------------------------------------------------------------- escena
const raiz = document.documentElement;
let tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const escena = new THREE.Scene();
const camara = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 60000);
const controles = new OrbitControls(camara, renderer.domElement);
controles.enableDamping = true; controles.dampingFactor = 0.07; controles.maxPolarAngle = Math.PI * 0.485;
controles.minDistance = 25; controles.maxDistance = 9000; controles.autoRotateSpeed = 0.3;


const cielo = new Sky(); cielo.scale.setScalar(45000); escena.add(cielo);
const uC = cielo.material.uniforms;
uC.turbidity.value = 7; uC.rayleigh.value = 1.6; uC.mieCoefficient.value = 0.004; uC.mieDirectionalG.value = 0.82;
const sol = new THREE.DirectionalLight(0xffffff, 3); sol.castShadow = true;
sol.shadow.mapSize.set(4096, 4096); sol.shadow.bias = -0.0003; sol.shadow.normalBias = 0.5;
escena.add(sol, sol.target);
const hemi = new THREE.HemisphereLight(0xcfdcff, 0x5a4a3a, 0.6); escena.add(hemi);
const pmrem = new THREE.PMREMGenerator(renderer);
const escenaCielo = new THREE.Scene(); const cieloEnv = new Sky(); cieloEnv.scale.setScalar(1000); escenaCielo.add(cieloEnv);
Object.assign(cieloEnv.material.uniforms.turbidity, { value: 7 }); cieloEnv.material.uniforms.rayleigh.value = 1.6;
let envRT = null;

// estrellas
const geoEst = new THREE.BufferGeometry(); const pe = [];
for (let i = 0; i < 2500; i++) { const u = Math.random(), v = Math.random() * 0.95; const th = 2 * Math.PI * u, ph = Math.acos(1 - v);
  pe.push(Math.sin(ph) * Math.cos(th) * 30000, Math.cos(ph) * 30000, Math.sin(ph) * Math.sin(th) * 30000); }
geoEst.setAttribute('position', new THREE.Float32BufferAttribute(pe, 3));
const matEst = new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
const estrellas = new THREE.Points(geoEst, matEst); escena.add(estrellas);

// ---------------------------------------------------------------- terreno
const uNoche = { value: 0 }, uTiempo = { value: 0 };
const geoT = new THREE.BufferGeometry();
const posT = new Float32Array(W * H * 3), uvT = new Float32Array(W * H * 2);
for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
  const k = j * W + i, x = -MX + CEL / 2 + CEL * i, z = -MZ + CEL / 2 + CEL * j;
  posT.set([x, elev[k], z], k * 3); uvT[k * 2] = (x + MX) / (2 * MX); uvT[k * 2 + 1] = 1 - (z + MZ) / (2 * MZ);
}
const indT = new Uint32Array((W - 1) * (H - 1) * 6); let q = 0;
for (let j = 0; j < H - 1; j++) for (let i = 0; i < W - 1; i++) {
  const a = j * W + i, b = a + 1, d = a + W, e = d + 1; indT[q++] = a; indT[q++] = d; indT[q++] = b; indT[q++] = b; indT[q++] = d; indT[q++] = e;
}
geoT.setAttribute('position', new THREE.BufferAttribute(posT, 3)); geoT.setAttribute('uv', new THREE.BufferAttribute(uvT, 2));
geoT.setIndex(new THREE.BufferAttribute(indT, 1)); geoT.computeVertexNormals();
const cargar = src => new Promise(ok => new THREE.TextureLoader().load(src, ok));
const [texSuelo, texLuz] = await Promise.all([cargar('data:image/webp;base64,' + C.textura), cargar('data:image/webp;base64,' + C.luz)]);
texSuelo.colorSpace = THREE.SRGBColorSpace; texSuelo.anisotropy = renderer.capabilities.getMaxAnisotropy();
texSuelo.generateMipmaps = true; texSuelo.minFilter = THREE.LinearMipmapLinearFilter;
// humedad (malla de 10 m) para la lluvia
const humedad = new Uint8Array(W * H);
const texHum = new THREE.DataTexture(humedad, W, H, THREE.RedFormat); texHum.magFilter = texHum.minFilter = THREE.LinearFilter; texHum.needsUpdate = true;
// máscara de la microcuenca (lienzo)
const lienzoM = document.createElement('canvas'); lienzoM.width = 1040; lienzoM.height = 1600;
{ const g = lienzoM.getContext('2d'); g.fillStyle = '#fff';
  for (const pol of C.microcuenca) { g.beginPath(); pol.forEach(([x, z], i) => { const u = (x + MX) / (2 * MX) * 1040, v = (z + MZ) / (2 * MZ) * 1600; i ? g.lineTo(u, v) : g.moveTo(u, v); }); g.closePath(); g.fill(); } }
const texMicro = new THREE.CanvasTexture(lienzoM); texMicro.flipY = false;
const uMicro = { value: 1 }, uAcento = { value: new THREE.Color(0xd97757) };
const matT = new THREE.MeshStandardMaterial({ map: texSuelo, roughness: 0.96, metalness: 0, envMapIntensity: 0.4 });
matT.onBeforeCompile = sh => {
  Object.assign(sh.uniforms, { uLuz: { value: texLuz }, uNoche, uHum: { value: texHum }, uMicroT: { value: texMicro }, uMicro, uAcento, uTiempo });
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec2 vSim;')
    .replace('#include <uv_vertex>', '#include <uv_vertex>\nvSim = vec2(uv.x, 1.0 - uv.y);');
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
    varying vec2 vSim; uniform sampler2D uLuz; uniform sampler2D uHum; uniform sampler2D uMicroT; uniform float uNoche; uniform float uMicro; uniform vec3 uAcento; uniform float uTiempo;`)
    .replace('#include <map_fragment>', `#include <map_fragment>
    float hum = texture2D(uHum, vSim).r;
    diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * 0.5 + vec3(0.12, 0.28, 0.42) * 0.5, smoothstep(0.02, 0.7, hum) * 0.85);
    float mc = texture2D(uMicroT, vSim).r * uMicro;
    diffuseColor.rgb = mix(diffuseColor.rgb, uAcento, mc * 0.1);`)
    .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
    roughnessFactor = mix(roughnessFactor, 0.25, smoothstep(0.05, 0.6, hum));`)
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
    float lz = texture2D(uLuz, vec2(vSim.x, 1.0 - vSim.y)).r;
    totalEmissiveRadiance += vec3(1.0, 0.7, 0.4) * lz * lz * 0.9 * uNoche;
    totalEmissiveRadiance += vec3(0.25, 0.6, 1.0) * pow(hum, 1.5) * 0.35;`);
};
const terreno = new THREE.Mesh(geoT, matT); terreno.receiveShadow = true; terreno.castShadow = true; escena.add(terreno);

// ---------------------------------------------------------------- edificios
const pos = [], nor = [], col = [], aW = [], aF = [];
const tanques = [];
const cA = new THREE.Color(), cB = new THREE.Color();
function tri(p1, p2, p3, n, c, w, f) {
  pos.push(...p1, ...p2, ...p3); for (let k = 0; k < 3; k++) { nor.push(...n); col.push(c.r, c.g, c.b); aW.push(...w[k]); aF.push(f); }
}
function normal(p1, p2, p3) {
  const ux = p2[0] - p1[0], uy = p2[1] - p1[1], uz = p2[2] - p1[2], vx = p3[0] - p1[0], vy = p3[1] - p1[1], vz = p3[2] - p1[2];
  const n = [uy * vz - uz * vy, uz * vx - ux * vz, ux * vy - uy * vx]; const l = Math.hypot(...n) || 1; return [n[0] / l, n[1] / l, n[2] / l];
}
function triArriba(p1, p2, p3, c, w, f) {          // triángulo de techo mirando hacia arriba
  let n = normal(p1, p2, p3); if (n[1] < 0) { [p2, p3] = [p3, p2]; n = [-n[0], -n[1], -n[2]]; }
  tri(p1, p2, p3, n, c, [w, w, w], f);
}
const PLAZA = C.plaza_c;
let iV = 0, iD = 0;
const nEd = E.cuenta;
for (let b = 0; b < nEd; b++) {
  const n = nV[b], x0 = pri[b * 2] / 10, z0 = pri[b * 2 + 1] / 10;
  const P = [[x0, z0]];
  for (let k = 1; k < n; k++) { P.push([x0 + dlt[iD * 2] / 10, z0 + dlt[iD * 2 + 1] / 10]); iD++; }
  const a = atr.subarray(b * 10, b * 10 + 10);
  const alto = a[0] / 4, techo = a[1], flags = a[8], rnd = a[9] / 255;
  cA.setRGB(a[2] / 255, a[3] / 255, a[4] / 255, THREE.SRGBColorSpace);
  cB.setRGB(a[5] / 255, a[6] / 255, a[7] / 255, THREE.SRGBColorSpace);
  let gmin = Infinity, gmax = -Infinity, cx = 0, cz = 0;
  for (const [x, z] of P) { const g = altura(x, z); gmin = Math.min(gmin, g); gmax = Math.max(gmax, g); cx += x; cz += z; }
  cx /= n; cz /= n;
  const suelo = gmax - Math.min(1.2, (gmax - gmin) * 0.35), base = gmin - 1.5, top = suelo + alto;
  const dPlaza = Math.hypot(cx - PLAZA[0], cz - PLAZA[1]);
  const tipoPared = (flags & 4) ? 3 : (flags & 1) ? 2 : 1;
  const fPared = tipoPared + ((dPlaza < 520 && rnd < 0.75 && alto > 4) ? 4 : 0);
  // paredes
  let u = 0;
  for (let k = 0; k < n; k++) {
    const [ax, az] = P[k], [bx, bz] = P[(k + 1) % n];
    const L = Math.hypot(bx - ax, bz - az); if (L < 0.05) continue;
    const nn = [-(bz - az) / L, 0, (bx - ax) / L];
    const w0 = [u, suelo, top, rnd], w1 = [u + L, suelo, top, rnd];
    tri([ax, base, az], [bx, base, bz], [bx, top, bz], nn, cA, [w0, w1, w1], fPared);
    tri([ax, base, az], [bx, top, bz], [ax, top, az], nn, cA, [w0, w1, w0], fPared);
    u += L;
  }
  // techo
  const wT = [0, suelo, top, rnd];
  if ((techo === 1 || techo === 2) && n === 4) {
    const e0 = Math.hypot(P[1][0] - P[0][0], P[1][1] - P[0][1]), e1 = Math.hypot(P[2][0] - P[1][0], P[2][1] - P[1][1]);
    let ux, uz; if (e0 >= e1) { ux = (P[1][0] - P[0][0]) / e0; uz = (P[1][1] - P[0][1]) / e0; } else { ux = (P[2][0] - P[1][0]) / e1; uz = (P[2][1] - P[1][1]) / e1; }
    const vx = -uz, vz = ux; let L = 0, Wd = 0;
    for (const [x, z] of P) { L = Math.max(L, Math.abs((x - cx) * ux + (z - cz) * uz)); Wd = Math.max(Wd, Math.abs((x - cx) * vx + (z - cz) * vz)); }
    const hR = Wd * Math.tan(techo === 1 ? 0.45 : 0.26), kk = techo === 1 ? Math.max(0, L - Wd) : L;
    const R = [[cx - ux * kk, top + hR, cz - uz * kk], [cx + ux * kk, top + hR, cz + uz * kk]];
    for (let k = 0; k < 4; k++) {
      const A = [P[k][0], top, P[k][1]], B = [P[(k + 1) % 4][0], top, P[(k + 1) % 4][1]];
      const sa = ((A[0] - cx) * ux + (A[2] - cz) * uz) >= 0 ? 1 : 0, sb = ((B[0] - cx) * ux + (B[2] - cz) * uz) >= 0 ? 1 : 0;
      if (sa === sb) {
        if (techo === 1) triArriba(A, B, R[sa], cB, wT, 0);
        else {   // hastial vertical
          let p2 = B, p3 = R[sa], nn = normal(A, p2, p3);

const MAXG = 7000, MAXP = 40000;
const gx = new Float32Array(MAXG), gy = new Float32Array(MAXG), gz = new Float32Array(MAXG), gv = new Float32Array(MAXG), gs = new Float32Array(MAXG);
const posG = new Float32Array(MAXG * 6), alfaG = new Float32Array(MAXG * 2); for (let i = 0; i < MAXG; i++) alfaG[i * 2 + 1] = 1;
const geoG = new THREE.BufferGeometry();
geoG.setAttribute('position', new THREE.BufferAttribute(posG, 3).setUsage(THREE.DynamicDrawUsage)); geoG.setAttribute('aA', new THREE.BufferAttribute(alfaG, 1));
const matG = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, uniforms: { uColor: { value: new THREE.Color(0x56708c) }, uA: { value: 0.7 } },
  vertexShader: `attribute float aA; varying float vA; void main(){ vA = aA; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 uColor; uniform float uA; varying float vA; void main(){ gl_FragColor = vec4(uColor, vA * uA); }` });

const pc = new Int32Array(MAXP), pt = new Float32Array(MAXP), pj = new Float32Array(MAXP * 2); let np = 0;
const posP = new Float32Array(MAXP * 3), flP = new Float32Array(MAXP);
const geoP = new THREE.BufferGeometry();
geoP.setAttribute('position', new THREE.BufferAttribute(posP, 3).setUsage(THREE.DynamicDrawUsage));

const matP = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.NormalBlending,
  uniforms: { uEsc: { value: innerHeight * 0.5 }, uNoche },

const FL = new Float32Array(W * H);
let lloviendo = false, intensidad = 60, credito = 0, ngAct = 0, tH = 0;
const NQ = 140, serie = new Float32Array(NQ); let qAc = 0, qT = 0, ref = 1;
function radioLluvia() { return THREE.MathUtils.clamp(camara.position.distanceTo(controles.target) * 0.75, 120, 2600); }
const centroG = new THREE.Vector3();
function nacerGota(i, arriba) {
  const d = camara.position.distanceTo(controles.target), R = THREE.MathUtils.clamp(d * 0.55, 50, 1600);
  centroG.lerpVectors(camara.position, controles.target, 0.45);
  gx[i] = centroG.x + (Math.random() * 2 - 1) * R; gz[i] = centroG.z + (Math.random() * 2 - 1) * R;
  const g = altura(gx[i], gz[i]), top = Math.max(g + 30, camara.position.y + R * 0.3);

function paso(dt) {

  const L = THREE.MathUtils.clamp(camara.position.distanceTo(controles.target) * 0.02, 1.5, 30);
  for (let i = 0; i < ngAct; i++) {

    const b = i * 6; posG[b] = gx[i]; posG[b + 1] = gy[i] + L; posG[b + 2] = gz[i]; posG[b + 3] = gx[i]; posG[b + 4] = gy[i]; posG[b + 5] = gz[i];

}
const lienzo = $('hidro'), ctx = lienzo.getContext('2d');

// ---------------------------------------------------------------- sol, cielo y noche
const LAT = THREE.MathUtils.degToRad(-11.42), DEC = THREE.MathUtils.degToRad(-8.9);

function actualizarSol() {
  const Hh = THREE.MathUtils.degToRad((hora - 11.85) * 15);

// ---------------------------------------------------------------- vistas y panel

const VISTAS = {

const estado = { arboles: true, nombres: true, micro: true, giro: false };

// ---------------------------------------------------------------- ciclo
const reloj = new THREE.Clock();
